<body>
 <header class="menu">

  <h1 class="logo">Tienda de Licores</h1>

  <!-- Botón hamburguesa -->

  <span></span>
  <span></span>
  <span></span>
</div>

  <!-- Menú -->
  <nav class="nav-menu" id="nav-menu">

    </ul>

</header>
  <main>
    <h2>Registrar Movimiento</h2>
    <form class="form-movimiento">
      <select required>
        <option>Whisky Escocés</option>
        <option>Cerveza Rubia</option>
        <!-- productos cargados dinámicamente -->
      </select>
      <select required>
        <option value="entrada">Entrada</option>
        <option value="salida">Salida</option>
        <option value="ajuste">Ajuste</option>
      </select>
      <input type="number" placeholder="Cantidad" required>
      <input type="date" required>
      <button type="submit">Registrar</button>
    </form>

    <h2>Movimientos de Inventario</h2>
    <form class="form-filtro">
      <select>
        <option value="">Todos</option>
        <option value="entrada">Entradas</option>
        <option value="salida">Salidas</option>
        <option value="ajuste">Ajustes</option>
      </select>
      <input type="date">
      <button type="submit">Filtrar</button>
    </form>

    <table class="tabla-movimientos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Producto</th>
          <th>Tipo</th>
          <th>Cantidad</th>
          <th>Fecha</th>
          <th>Usuario</th>
        </tr>
      </thead>
      <tbody>
        <!-- Aquí se llenará con los movimientos -->
      </tbody>
    </table>
  </main>
  <script src="js/script.js"></script>
